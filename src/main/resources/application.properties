# General application settings
spring.application.name=${SPRING_APPLICATION_NAME:Complaint Management System}

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.dialect=${SPRING_JPA_HIBERNATE_DIALECT}
# spring.jpa.properties.hibernate.default_batch_fetch_size=500

# Allow up to 10,000 results per page
spring.data.web.pageable.max-page-size=5000

# Timezone configuration for Railway/production
spring.jackson.time-zone=Asia/Karachi
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Karachi

# Logging levels
logging.level.root=${LOGGING_LEVEL_ROOT:ERROR}
logging.level.com.system.complaints=${LOGGING_LEVEL_COMPLAINTS:ERROR}
logging.level.org.springframework=${LOGGING_LEVEL_SPRING:ERROR}
logging.level.org.springframework.security=${LOGGING_LEVEL_SPRING_SECURITY:ERROR}
logging.level.org.hibernate=${LOGGING_LEVEL_HIBERNATE:ERROR}

# Google Drive
google.drive.folder-id=${GOOGLE_DRIVE_FOLDER_ID}
google.drive.client-id=${GOOGLE_CLIENT_ID}
google.drive.client-secret=${GOOGLE_CLIENT_SECRET}
google.drive.refresh-token=${GOOGLE_REFRESH_TOKEN}

# Google Maps
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# CORS configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Dotenv support
dotenv.enabled=true
dotenv.overload=true

# Session timeout
server.servlet.session.timeout=604800

# Long-running exports need more than Spring MVC's default async timeout.
spring.mvc.async.request-timeout=${SPRING_MVC_ASYNC_REQUEST_TIMEOUT:600000}

# Cross-site session cookie settings. Use SESSION_COOKIE_SAME_SITE=none and
# SESSION_COOKIE_SECURE=true on Railway when frontend/backend are different HTTPS domains.
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:none}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# Respect proxy headers from Railway
server.forward-headers-strategy=framework
